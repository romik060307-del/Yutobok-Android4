name: Build Yutobok APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Verify Android project files
        working-directory: YutobokAndroid
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle || { echo "ERROR: YutobokAndroid/settings.gradle tidak ditemukan."; exit 1; }
          test -f build.gradle || { echo "ERROR: YutobokAndroid/build.gradle tidak ditemukan."; exit 1; }
          test -f app/build.gradle || { echo "ERROR: YutobokAndroid/app/build.gradle tidak ditemukan."; exit 1; }
          echo "Struktur project ditemukan."
          if [ -f gradlew ]; then
            echo "Gradle wrapper tersedia."
          else
            echo "Gradle wrapper tidak ada; build akan memakai Gradle 8.9 yang dipasang oleh GitHub Actions."
          fi

      - name: Build debug APK
        working-directory: YutobokAndroid
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK output
        shell: bash
        run: test -s "YutobokAndroid/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Yutobok-Android-APK
          path: YutobokAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
